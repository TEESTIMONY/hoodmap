# Scheduled ingest sync — the free, no-new-account way to run the indexer
# worker before/instead of paying for an always-on host (Render Starter,
# Fly.io, etc.). Runs lib/indexer/run-once.ts (transfer sync), then
# lib/indexer/prune-once.ts (deletes transfer rows older than the retention
# window — the unfiltered chain-wide scan grows without bound otherwise;
# this already exceeded Supabase's free-tier storage quota once and flipped
# the database read-only mid-sync), then lib/indexer/snapshot-once.ts
# (balance/metadata snapshot for tracked tokens), then
# lib/indexer/backfill-wallets-once.ts (walks tracked wallets' history
# backward toward genesis — see wallet-backfill.ts; this table is
# deliberately NOT subject to the same pruning as `transfers`, since a
# wallet's full history is the whole point of the wallet passport) on a
# schedule; each run picks up exactly where the last one left off (progress
# is durable in Postgres — sync_state for the transfer sync,
# tracked_tokens.last_snapshot_at for the balance snapshot,
# tracked_wallets.backfill_cursor_block for the wallet backfill), so a
# missed or overlapping run is harmless.
#
# Setup required before this does anything:
#   1. Add a repo secret named DATABASE_URL (Settings -> Secrets and
#      variables -> Actions -> New repository secret) with your Supabase
#      Postgres connection string.
#   2. Run `npm run db:generate && npm run db:migrate` once (locally, with
#      DATABASE_URL set) so the tables exist before this workflow's first run.
#
# To move to a continuous always-on worker later (e.g. Render Starter),
# this workflow can simply be disabled/deleted — lib/indexer/run.ts (the
# runForever entrypoint) is the equivalent for that host, no code changes
# needed, same DATABASE_URL.
name: Indexer sync

on:
  schedule:
    # Every 15 minutes. GitHub's actual minimum is 5 minutes, but schedule
    # triggers can be delayed under platform load — 15 minutes leaves
    # comfortable margin so a delayed run doesn't overlap awkwardly with
    # the next one, while still keeping data far fresher than the
    # previous "no persistence at all" baseline.
    - cron: "*/15 * * * *"
  # Lets you trigger a run manually from the Actions tab — useful for the
  # very first run (backfill needs to start somewhere) and for testing.
  workflow_dispatch:

concurrency:
  # Prevents two sync runs from overlapping if one runs long — not
  # incorrect if they did (ingestion is idempotent), just wasted RPC/DB
  # load for no benefit.
  group: indexer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bumped 10 -> 16 -> 18 -> 22 minutes to fit the wallet-backfill step
    # alongside the existing sync/prune/snapshot steps, each bounded by its
    # own time budget below, plus headroom for checkout/npm ci/node startup.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to match the npm major version (11.x, bundled with
          # Node 24) that package-lock.json was actually generated and
          # validated against locally. Node 22's bundled npm (10.x) failed
          # `npm ci` against this exact, otherwise-valid lockfile with a
          # "Missing: zod@... from lock file" error — confirmed live: the
          # identical lockfile content passes cleanly under npm 11 and
          # fails under whatever ships with Node 22. This is an npm
          # version behavior difference in lockfileVersion 3 validation,
          # not a real lockfile problem.
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npx tsx lib/indexer/run-once.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ~5 minutes — trimmed to make room for the prune step below
          # inside the same job timeout.
          INDEXER_TIME_BUDGET_MS: "300000"
      # Deletes transfer rows older than the retention window (see
      # lib/indexer/prune.ts for why this exists and how the window was
      # chosen). Runs right after the sync step, before the snapshot step —
      # partly so the snapshot job's own "full history" query reads a
      # bounded, already-pruned table rather than an ever-growing one.
      - run: npx tsx lib/indexer/prune-once.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRUNE_TIME_BUDGET_MS: "180000"
      # Balance/metadata snapshot for whichever tokens have actually been
      # scanned (trackedTokens — see lib/indexer/hybrid-balances.ts). Runs
      # after the transfer sync so a token tracked seconds ago by this
      # run's own sync activity is already eligible. A token with nothing
      # tracked yet is a no-op pass, not an error.
      - run: npx tsx lib/indexer/snapshot-once.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ~5 minutes, leaving headroom inside the 22-minute job timeout
          # above alongside the sync/prune/wallet-backfill steps and
          # checkout/npm ci/node startup.
          SNAPSHOT_TIME_BUDGET_MS: "300000"
      # Walks each tracked wallet's history backward toward genesis (see
      # lib/indexer/wallet-backfill.ts). Runs last: it depends on
      # tracked_wallets rows that a scan this very run's sync step didn't
      # create (those come from hybrid-wallet-transfers.ts, triggered by an
      # actual wallet-passport page view, not by this workflow) — ordering
      # relative to sync/prune/snapshot doesn't matter for correctness, this
      # position just leaves it last since it's the newest, least-proven
      # step.
      - run: npx tsx lib/indexer/backfill-wallets-once.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WALLET_BACKFILL_TIME_BUDGET_MS: "180000"
